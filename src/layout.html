<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}
<meta name="theme-color" content="#1A1030">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site.url}}/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A GRC dome in front of a setting sun, with the words: Your design, cast in GRC and FRP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/img/favicon-96.png" sizes="96x96" type="image/png">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/geologica-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
{{styles}}
<script>
  // "motion" turns on the drawing and casting animations. If site.js never runs, it is removed so nothing stays hidden.
  (function (root) {
    root.classList.add('js');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      root.classList.add('motion');
      setTimeout(function () { if (!window.rjMotionReady) root.classList.remove('motion'); }, 4000);
    }
  })(document.documentElement);
</script>
<script src="/assets/js/site.js" defer></script>
{{scripts}}
<script type="application/ld+json">
{{jsonld}}
</script>
</head>
<body class="{{page.bodyClass}}">
{{> svg-defs}}
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main">
<!-- content -->
</main>
{{> footer}}
</body>
</html>
