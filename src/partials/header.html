<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="wordmark" href="/">
      <span class="wordmark__mark" aria-hidden="true">RJIC</span>
      <span class="wordmark__name"><span class="visually-hidden">RJIC, </span>RJ Interiors &amp;<br>Constructions</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <svg viewBox="0 0 18 14" width="18" height="14" aria-hidden="true"><path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="2"/></svg>
      <span>Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="site-nav__list" role="list">
        {{nav}}
      </ul>
      <div class="site-nav__contact">
        <a class="btn" href="/contact/?type=quote#enquiry">Request a quote</a>
        <a class="site-nav__phone" href="tel:{{site.phones.0.tel}}">{{site.phones.0.display}}</a>
      </div>
    </nav>
  </div>
</header>
