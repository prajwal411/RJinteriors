<section class="footer-cta" aria-labelledby="footer-cta-title">
  <div class="wrap footer-cta__inner">
    <div class="footer-cta__text">
      <h2 class="footer-cta__title" id="footer-cta-title" data-cure>Send us your drawing</h2>
      <p>Share drawings or photos with sizes, quantities and your site location, and we will prepare a quote.</p>
    </div>
    <div class="footer-cta__actions">
      <a class="btn" href="/contact/?type=quote#enquiry">Request a quote</a>
      <p class="footer-cta__call">Or call <a href="tel:{{site.phones.0.tel}}">{{site.phones.0.display}}</a></p>
    </div>
    <div class="footer-cta__drawing" data-draw aria-hidden="true">{{cta-drawing}}</div>
  </div>
</section>
